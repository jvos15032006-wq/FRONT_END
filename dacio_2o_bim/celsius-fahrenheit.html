<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Conversor de Temperatura</title>

<style>

body{
    font-family: Arial;
    background-color: #e9e9e9;
}

#caixa{
    width: 300px;
    background-color: white;
    margin: auto;
    margin-top: 100px;
    padding: 15px;
    border: 1px solid #ccc;
}

h2{
    text-align: center;
}

input{
    width: 95%;
    padding: 8px;
    margin-top: 5px;
    margin-bottom: 15px;
}

</style>

</head>
<body>

<div id="caixa">

<h2>Conversor</h2>

<label>Celsius</label>
<input type="text" id="celsius">

<label>Fahrenheit</label>
<input type="text" id="fahrenheit">

</div>

<script>

let celsius = document.getElementById("celsius");
let fahrenheit = document.getElementById("fahrenheit");

celsius.onkeyup = function(){

    let valor = parseFloat(celsius.value);

    if(isNaN(valor)){
        fahrenheit.value = "";
    }
    else{
        fahrenheit.value = (valor * 9/5) + 32;
    }

}

fahrenheit.onkeyup = function(){

    let valor = parseFloat(fahrenheit.value);

    if(isNaN(valor)){
        celsius.value = "";
    }
    else{
        celsius.value = (valor - 32) * 5/9;
    }

}

</script>

</body>
</html>
