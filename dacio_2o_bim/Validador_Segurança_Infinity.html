<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Verificador de Cartão</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .caixa {
            background-color: white;
            max-width: 420px;
            margin: auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            box-sizing: border-box;
            border: 1px solid #bbb;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            border: none;
            background-color: #2d6cdf;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1f54b5;
        }

        .resultado {
            margin-top: 20px;
            display: none;
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }

        .erro {
            color: #c62828;
            font-weight: bold;
        }

        .ok {
            color: #2e7d32;
            font-weight: bold;
        }

        p {
            margin: 8px 0;
        }
    </style>
</head>

<body>

    <div class="caixa">

        <h2>Verificador de Cartão</h2>

        <input 
            type="text" 
            id="numeroCartao"
            placeholder="Digite o número do cartão"
        >

        <button onclick="verificarCartao()">
            Verificar
        </button>

        <div class="resultado" id="resultado">

            <p>
                <strong>Status:</strong>
                <span id="status"></span>
            </p>

            <p>
                <strong>Bandeira:</strong>
                <span id="bandeira"></span>
            </p>

            <p>
                <strong>IIN:</strong>
                <span id="iin"></span>
            </p>

            <p>
                <strong>Categoria:</strong>
                <span id="categoria"></span>
            </p>

        </div>

    </div>

    <script>

        function verificarCartao() {

            let entrada = document.getElementById("numeroCartao").value;

            let numero = entrada.replace(/\D/g, "");

            let status = document.getElementById("status");
            let bandeira = document.getElementById("bandeira");
            let iin = document.getElementById("iin");
            let categoria = document.getElementById("categoria");
            let resultado = document.getElementById("resultado");

            resultado.style.display = "block";

            if (numero.length < 13 || numero.length > 19) {

                status.innerText = "Número inválido";
                status.className = "erro";

                limparResultado();
                return;
            }

            let soma = 0;
            let multiplicar = false;

            for (let i = numero.length - 1; i >= 0; i--) {

                let digito = Number(numero[i]);

                if (multiplicar) {

                    digito = digito * 2;

                    if (digito > 9) {
                        digito -= 9;
                    }
                }

                soma += digito;

                multiplicar = !multiplicar;
            }

            if (soma % 10 !== 0) {

                status.innerText = "Cartão inválido";
                status.className = "erro";

                limparResultado();
                return;
            }

            status.innerText = "Cartão válido";
            status.className = "ok";

            iin.innerText = numero.substring(0, 6);

            let tipo = "Desconhecida";

            if (numero.startsWith("4")) {
                tipo = "Visa";
            }
            else if (
                numero.startsWith("51") ||
                numero.startsWith("52") ||
                numero.startsWith("53") ||
                numero.startsWith("54") ||
                numero.startsWith("55")
            ) {
                tipo = "Mastercard";
            }
            else if (
                numero.startsWith("34") ||
                numero.startsWith("37")
            ) {
                tipo = "American Express";
            }

            bandeira.innerText = tipo;

            let primeiroDigito = numero[0];

            switch (primeiroDigito) {

                case "3":
                    categoria.innerText = "Viagens e entretenimento";
                    break;

                case "4":
                case "5":
                    categoria.innerText = "Financeiro";
                    break;

                case "6":
                    categoria.innerText = "Comércio e serviços";
                    break;

                default:
                    categoria.innerText = "Outros";
            }
        }

        function limparResultado() {

            document.getElementById("bandeira").innerText = "-";
            document.getElementById("iin").innerText = "-";
            document.getElementById("categoria").innerText = "-";
        }

    </script>

</body>

</html>
